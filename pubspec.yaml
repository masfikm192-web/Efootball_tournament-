}

// ---------------- LOGIN & REGISTER SCREEN ----------------
class AuthScreen extends StatefulWidget {
  const AuthScreen({super.key});

  @override
  State<AuthScreen> createState() => _AuthScreenState();
}

class _AuthScreenState extends State<AuthScreen> {
  bool isLogin = true;
  final _emailController = TextEditingController();
  final _passwordController = TextEditingController();
  final _nameController = TextEditingController();
  final _gameIdController = TextEditingController();
  bool isLoading = false;

  Future<void> _submit() async {
    setState(() => isLoading = true);
    try {
      if (isLogin) {
        await FirebaseAuth.instance.signInWithEmailAndPassword(
          email: _emailController.text.trim(),
          password: _passwordController.text.trim(),
        );
      } else {
        UserCredential res = await FirebaseAuth.instance.createUserWithEmailAndPassword(
          email: _emailController.text.trim(),
          password: _passwordController.text.trim(),
        );
        await FirebaseFirestore.instance.collection('users').doc(res.user!.uid).set({
          'uid': res.user!.uid,
          'name': _nameController.text.trim(),
          'gameId': _gameIdController.text.trim(),
          'email': _emailController.text.trim(),
          'balance': 0,
          'createdAt': FieldValue.serverTimestamp(),
        });
      }
    } catch (e) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text(e.toString())),
      );
    } finally {
      if (mounted) setState(() => isLoading = false);
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Padding(
        padding: const EdgeInsets.all(24.0),
        child: Center(
          child: SingleChildScrollView(
            child: Column(
              mainAxisAlignment: MainAlignment.center,
              children: [
                const Icon(Icons.sports_esports, size: 80, color: Colors.blueAccent),
                const SizedBox(height: 16),
                Text(
                  isLogin ? 'eFootball Login' : 'Create Account',
                  style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white),
                ),
                const SizedBox(height: 24),
                if (!isLogin) ...[
                  TextField(
                    controller: _nameController,
                    decoration: const InputDecoration(labelText: 'Full Name', border: OutlineInputBorder()),
                  ),
                  const SizedBox(height: 12),
                  TextField(
                    controller: _gameIdController,
                    decoration: const InputDecoration(labelText: 'eFootball Game ID', border: OutlineInputBorder()),
                  ),
                  const SizedBox(height: 12),
                ],
                TextField(
                  controller: _emailController,
                  decoration: const InputDecoration(labelText: 'Email', border: OutlineInputBorder()),
                ),
                const SizedBox(height: 12),
                TextField(
                  controller: _passwordController,
                  obscureText: true,
                  decoration: const InputDecoration(labelText: 'Password', border: OutlineInputBorder()),
                ),
                const SizedBox(height: 20),
                ElevatedButton(
                  onPressed: isLoading ? null : _submit,
                  style: ElevatedButton.styleFrom(
                    minimumSize: const Size(double.infinity, 50),
                    backgroundColor: Colors.blueAccent,
                  ),
                  child: isLoading
                      ? const CircularProgressIndicator(color: Colors.white)
                      : Text(isLogin ? 'LOGIN' : 'REGISTER', style: const TextStyle(fontSize: 16)),
                ),
                TextButton(
                  onPressed: () => setState(() => isLogin = !isLogin),
                  child: Text(
                    isLogin ? "Don't have an account? Register" : "Already have an account? Login",
                    style: const TextStyle(color: Colors.blueAccent),
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }
}

// ---------------- TOURNAMENTS LIST & JOIN ----------------
class HomeScreen extends StatelessWidget {
  const HomeScreen({super.key});

  Future<void> _joinMatch(BuildContext context, String matchId, int entryFee) async {
    final uid = FirebaseAuth.instance.currentUser?.uid;
    if (uid == null) return;

    final userDoc = await FirebaseFirestore.instance.collection('users').doc(uid).get();
    final currentBalance = (userDoc.data()?['balance'] ?? 0) as int;

    if (currentBalance < entryFee) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Insufficient Balance! Please add money to wallet.')),
      );
      return;
    }

    await FirebaseFirestore.instance.runTransaction((transaction) async {
      DocumentReference matchRef = FirebaseFirestore.instance.collection('matches').doc(matchId);
      DocumentReference userRef = FirebaseFirestore.instance.collection('users').doc(uid);

      DocumentSnapshot matchSnapshot = await transaction.get(matchRef);
      List joinedUsers = matchSnapshot.get('joinedUsers') ?? [];

      if (joinedUsers.contains(uid)) {
        throw Exception('Already joined this match!');
      }

      transaction.update(userRef, {'balance': currentBalance - entryFee});
      transaction.update(matchRef, {
        'joinedUsers': FieldValue.arrayUnion([uid]),
      });
    });

    ScaffoldMessenger.of(context).showSnackBar(
      const SnackBar(content: Text('Successfully Joined Match!')),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('eFootball Tournaments'),
        centerTitle: true,
        backgroundColor: const Color(0xFF131629),
      ),
      body: StreamBuilder<QuerySnapshot>(
        stream: FirebaseFirestore.instance.collection('matches').snapshots(),
        builder: (context, snapshot) {
          if (!snapshot.hasData) {
            return const Center(child: CircularProgressIndicator());
          }
          final matches = snapshot.data!.docs;
          if (matches.isEmpty) {
            return const Center(child: Text('No active matches right now.', style: TextStyle(color: Colors.grey)));
          }
          return ListView.builder(
            itemCount: matches.length,
            itemBuilder: (context, index) {
              final match = matches[index];
              final title = match['title'] ?? 'Match';
              final entryFee = match['entryFee'] ?? 0;
              final prize = match['prize'] ?? 0;
              final roomId = match['roomId'] ?? 'Waiting...';
              final roomPassword = match['roomPassword'] ?? '';
              final joinedList = List.from(match['joinedUsers'] ?? []);
              final isJoined = joinedList.contains(FirebaseAuth.instance.currentUser?.uid);

              return Card(
                margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                color: const Color(0xFF181B33),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                child: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAlignment.start,
                    children: [
                      Text(title, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                      const SizedBox(height: 8),
                      Row(
                        mainAxisAlignment: MainAlignment.spaceBetween,
                        children: [
                          Text('Entry: ৳$entryFee', style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                          Text('Prize: ৳$prize', style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                          Text('Joined: ${joinedList.length}', style: const TextStyle(color: Colors.white70)),
                        ],
                      ),
                      const Divider(color: Colors.white24, height: 20),
                      if (isJoined) ...[
                        Container(
                          padding: const EdgeInsets.all(8),
                          decoration: BoxDecoration(color: Colors.blueAccent.withOpacity(0.2), borderRadius: BorderRadius.circular(8)),
                          child: Row(
                            mainAxisAlignment: MainAlignment.spaceBetween,
                            children: [
                              Text('Room ID: $roomId', style: const TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                              Text('Pass: $roomPassword', style: const TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                            ],
                          ),
                        ),
                      ] else ...[
                        ElevatedButton(
                          onPressed: () => _joinMatch(context, match.id, entryFee),
                          style: ElevatedButton.styleFrom(
                            backgroundColor: Colors.blueAccent,
                            minimumSize: const Size(double.infinity, 40),
                          ),
                          child: const Text('JOIN MATCH'),
                        ),
                      ]
                    ],
                  ),
                ),
              );
            },
          );
        },
      ),
    );
  }
}

// ---------------- BKASH / NAGAD WALLET ----------------
class WalletScreen extends StatefulWidget {
  const WalletScreen({super.key});

  @override
  State<WalletScreen> createState() => _WalletScreenState();
}

class _WalletScreenState extends State<WalletScreen> {
  final _amountController = TextEditingController();
  final _trxIdController = TextEditingController();
  String selectedMethod = 'bKash';

  Future<void> _requestDeposit() async {
    final uid = FirebaseAuth.instance.currentUser?.uid;
    if (uid == null) return;

    if (_amountController.text.isEmpty || _trxIdController.text.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Please fill all fields!')));
      return;
    }

    await FirebaseFirestore.instance.collection('deposits').add({
      'uid': uid,
      'amount': int.tryParse(_amountController.text.trim()) ?? 0,
      'method': selectedMethod,
      'trxId': _trxIdController.text.trim(),
      'status': 'Pending',
      'timestamp': FieldValue.serverTimestamp(),
    });

    _amountController.clear();
    _trxIdController.clear();

    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Deposit request submitted!')));
  }

  @override
  Widget build(BuildContext context) {
    final uid = FirebaseAuth.instance.currentUser?.uid;

    return Scaffold(
      appBar: AppBar(title: const Text('My Wallet'), backgroundColor: const Color(0xFF131629)),
      body: SingleChildScrollView(
        padding: const EdgeInsets.all(16.0),
        child: Column(
          crossAxisAlignment: CrossAlignment.start,
          children: [
            StreamBuilder<DocumentSnapshot>(
              stream: FirebaseFirestore.instance.collection('users').doc(uid).snapshots(),
              builder: (context, snapshot) {
                final balance = snapshot.data?.get('balance') ?? 0;
                return Container(
                  width: double.infinity,
                  padding: const EdgeInsets.all(20),
                  decoration: BoxDecoration(
                    gradient: const LinearGradient(colors: [Colors.blueAccent, Colors.indigo]),
                    borderRadius: BorderRadius.circular(16),
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAlignment.start,
                    children: [
                      const Text('Current Balance', style: TextStyle(color: Colors.white70, fontSize: 16)),
                      const SizedBox(height: 8),
                      Text('৳$balance', style: const TextStyle(color: Colors.white, fontSize: 32, fontWeight: FontWeight.bold)),
                    ],
                  ),
                );
              },
            ),
            const SizedBox(height: 24),
            const Text('Deposit Money (bKash / Nagad)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
            const SizedBox(height: 8),
            const Text('Send Money to: 01700000000 (Personal)', style: TextStyle(color: Colors.amberAccent)),
            const SizedBox(height: 16),
            DropdownButton<String>(
              value: selectedMethod,
              isExpanded: true,
              dropdownColor: const Color(0xFF181B33),
              items: ['bKash', 'Nagad', 'Rocket'].map((e) => DropdownMenuItem(value: e, child: Text(e))).toList(),
              onChanged: (val) => setState(() => selectedMethod = val!),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: _amountController,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(labelText: 'Amount (BDT)', border: OutlineInputBorder()),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: _trxIdController,
              decoration: const InputDecoration(labelText: 'Transaction ID (TrxID)', border: OutlineInputBorder()),
            ),
            const SizedBox(height: 16),
            ElevatedButton(
              onPressed: _requestDeposit,
              style: ElevatedButton.styleFrom(
                backgroundColor: Colors.green,
                minimumSize: const Size(double.infinity, 50),
              ),
              child: const Text('SUBMIT DEPOSIT'),
            ),
          ],
        ),
      ),
    );
  }
}

// ---------------- ADMIN PANEL ----------------
class AdminDashboard extends StatefulWidget {
  const AdminDashboard({super.key});

  @override
  State<AdminDashboard> createState() => _AdminDashboardState();
}

class _AdminDashboardState extends State<AdminDashboard> {
  final _titleController = TextEditingController();
  final _entryFeeController = TextEditingController();
  final _prizeController = TextEditingController();

  Future<void> _createMatch() async {
    if (_titleController.text.isEmpty) return;

    await FirebaseFirestore.instance.collection('matches').add({
      'title': _titleController.text.trim(),
      'entryFee': int.tryParse(_entryFeeController.text.trim()) ?? 0,
      'prize': int.tryParse(_prizeController.text.trim()) ?? 0,
      'roomId': 'Pending',
      'roomPassword': '',
      'joinedUsers': [],
      'createdAt': FieldValue.serverTimestamp(),
    });

    _titleController.clear();
    _entryFeeController.clear();
    _prizeController.clear();

    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Match Created Successfully!')));
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Admin Panel'), backgroundColor: const Color(0xFF131629)),
      body: Padding(
        padding: const EdgeInsets.all(16.0),
        child: SingleChildScrollView(
          child: Column(
            crossAxisAlignment: CrossAlignment.start,
            children: [
              const Text('Create New Match', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
              const SizedBox(height: 12),
              TextField(controller: _titleController, decoration: const InputDecoration(labelText: 'Match Title', border: OutlineInputBorder())),
              const SizedBox(height: 8),
              TextField(controller: _entryFeeController, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Entry Fee (BDT)', border: OutlineInputBorder())),
              const SizedBox(height: 8),
              TextField(controller: _prizeController, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Prize Pool (BDT)', border: OutlineInputBorder())),
              const SizedBox(height: 12),
              ElevatedButton(
                onPressed: _createMatch,
                style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, minimumSize: const Size(double.infinity, 45)),
                child: const Text('CREATE MATCH'),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
